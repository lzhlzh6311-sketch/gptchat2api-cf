name: Docker image (fork)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-fork
  cancel-in-progress: true

jobs:
  image:
    if: github.repository_owner == 'lzhlzh6311-sketch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: v
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=fork-${{ steps.v.outputs.sha }}
          tags: |
            ghcr.io/lzhlzh6311-sketch/chatgpt2api:latest
            ghcr.io/lzhlzh6311-sketch/chatgpt2api:${{ steps.v.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
